name: generate-release

on:
  push:
    branches: [ master, test ]

jobs:
  generate_release:
    runs-on: ubuntu-latest
    name: Generate release
    steps:
    - name: Checkout
      uses: actions/checkout@v2
      with:
        lfs: 'true'
    - name: Build
      uses: shalzz/zola-deploy-action@v0.20.0
      env:
        BUILD_ONLY: true
    - name: Postprocess - Setup Node
      uses: actions/setup-node@v3
    - name: Postprocess - Install Dependencies
      run: |
        npm install
        npx playwright install --with-deps
    - name: Postprocess - Run Scripts
      run: |
        bash ./scripts/ci_fix_permissions.sh
        npm run check:content
        bash ./scripts/ci_pack_public.sh
        npm run check:site -- public.clean
        python3 -m http.server 4173 --directory public.clean &
        SERVER_PID=$!
        trap 'kill $SERVER_PID' EXIT
        for attempt in $(seq 1 30); do
          curl --fail --silent http://127.0.0.1:4173/ >/dev/null && break
          sleep 1
        done
        curl --fail --silent http://127.0.0.1:4173/ >/dev/null
        npm run check:reading -- http://127.0.0.1:4173
        kill $SERVER_PID
        trap - EXIT
        npm run pdf
        test ! -d public.clean/_print
        test -s public.clean/dl/rust_cheat_sheet_a4.pdf
        test -s public.clean/dl/rust_cheat_sheet_letter.pdf
        npm run check:site -- public.clean --final
    - name: Upload S3
      uses: shallwefootball/upload-s3-action@v1.3.3
      with:
        aws_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        endpoint: ${{ vars.AWS_ENDPOINT }}
        aws_bucket: 'cheats.rs'
        source_dir: 'public.clean'
        destination_dir: ''
    - name: Purge Cache
      uses: jakejarvis/cloudflare-purge-action@v0.3.0
      env:
        CLOUDFLARE_ZONE: ${{ vars.CLOUDFLARE_ZONE }}
        CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
